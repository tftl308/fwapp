class UpdateEngine {
  static async checkForUpdates(isManual = false) {
    try {
      const res = await fetch('./data/version.json?_t=' + Date.now(), { cache: 'no-store' });
      if (!res.ok) return { available: false };
      const remote = await res.json();
      
      const local = await storage.getSetting('app_version_meta') || {
        app_build: "0",
        songs_hash: "",
        playlists_hash: "",
        notes_hash: ""
      };

      const hasNewBuild = remote.app_build && remote.app_build !== local.app_build;
      const needsData = remote.songs_hash !== local.songs_hash ||
                        remote.playlists_hash !== local.playlists_hash ||
                        remote.notes_hash !== local.notes_hash;

      const result = {
        available: hasNewBuild || needsData,
        remote,
        local,
        needsApp: hasNewBuild,
        needsData: needsData
      };

      AppLogger.info('UPDATE', `Сверка версии: local=${local.app_build} remote=${remote.app_build} (доступно: ${result.available})`);

      if (result.available) {
        UpdateEngine.renderHeaderBadge(result);
        if (isManual) {
          UpdateEngine.showUpdateModal(result);
        }
      } else if (isManual) {
        AppController.showToast('✓ У вас установлена самая свежая версия программы и песен!');
      }

      return result;
    } catch(err) {
      if (isManual) {
        AppController.showToast('Работа в офлайн-режиме: сервер недоступен');
      }
      return { available: false, offline: true };
    }
  }

  static renderHeaderBadge(updateInfo) {
    // По требованию: кнопка обновления на главной странице убрана,
    // обновление выполняется строго через вкладку «Опции» / «Настройки».
    window._lastUpdateInfo = updateInfo;
  }

  static showUpdateModal(info) {
    const existing = document.getElementById('update-modal-overlay');
    if (existing) existing.remove();

    const overlay = Renderer.createElement('div', {
      id: 'update-modal-overlay',
      className: 'qr-modal-overlay',
      style: 'display: flex;'
    });

    const box = Renderer.createElement('div', { className: 'update-modal-box' });

    box.appendChild(Renderer.createElement('h3', { style: 'margin: 0; color: var(--accent);' }, ['🚀 Доступно обновление Огненный Ветер']));
    
    const verRow = Renderer.createElement('div', { className: 'text-xs text-muted' }, [
      `Текущая сборка: ${info.local.app_build || 'начальная'} ➔ Новая: ${info.remote.app_build || info.remote.app_version}`
    ]);
    box.appendChild(verRow);

    if (info.remote.changelog) {
      const chgBox = Renderer.createElement('div', {
        style: 'background: rgba(180, 83, 9, 0.08); border-radius: 6px; padding: 0.6rem; font-size: 0.82rem; border-left: 3px solid var(--accent);'
      }, [
        Renderer.createElement('strong', {}, ['Что нового: ']),
        info.remote.changelog
      ]);
      box.appendChild(chgBox);
    }

    const progressDiv = Renderer.createElement('div', {
      id: 'update-progress-status',
      className: 'text-xs',
      style: 'color: var(--text-muted); min-height: 1.2rem;'
    }, ['Нажмите кнопку ниже для загрузки одним нажатием.']);
    box.appendChild(progressDiv);

    const btnRow = Renderer.createElement('div', { style: 'display: flex; gap: 0.5rem; justify-content: flex-end; margin-top: 0.5rem;' }, [
      Renderer.createElement('button', {
        className: 'btn btn-outline btn-sm',
        dataset: { action: 'close-update-modal' }
      }, ['Позже']),
      Renderer.createElement('button', {
        className: 'btn btn-primary btn-sm',
        id: 'btn-run-update-now',
        style: 'background: var(--accent); border-color: var(--accent); font-weight: 700;',
        dataset: { action: 'apply-full-update' }
      }, ['⚡ Обновить сейчас'])
    ]);
    box.appendChild(btnRow);

    overlay.appendChild(box);
    document.body.appendChild(overlay);
  }

  static async applyFullUpdate(info) {
    const statusEl = document.getElementById('update-progress-status');
    const updateBtn = document.getElementById('btn-run-update-now');
    if (updateBtn) updateBtn.disabled = true;

    try {
      if (statusEl) statusEl.textContent = '1/4. Скачивание каталога песен (songs.csv)...';
      const songsRes = await fetch('./data/songs.csv?_t=' + Date.now(), { cache: 'no-store' });
      if (songsRes.ok) {
        const text = await songsRes.text();
        const records = CsvHelper.parse(text);
        if (records && records.length > 0) {
          const songsList = records.map(r => ({
            id: String(r.id || '').padStart(4, '0'),
            number: r.number || r.id,
            title: r.title || 'Без названия',
            author: r.author || '',
            key: r.key || '',
            key_default: r.key || '',
            capo: r.capo || '',
            tempo: r.tempo || '',
            time_signature: r.time_signature || '4/4',
            duration: r.duration || '',
            predelay: r.predelay || '',
            presentation: r.presentation || '',
            theme: r.theme || r.alt_title || '',
            alttheme: r.alttheme || '',
            user1: r.user1 || '',
            user2: r.user2 || '',
            user3: r.user3 || '',
            lyrics: r.lyrics || r.body_plain || '',
            body_plain: r.lyrics || r.body_plain || '',
            chordpro: r.chordpro || r.body_chordpro || '',
            body_chordpro: r.chordpro || r.body_chordpro || '',
            notes: r.notes || '',
            link_audio: r.link_audio || '',
            link_youtube: r.link_youtube || '',
            custom_chords: r.custom_chords || ''
          }));
          await storage.clear('songs');
          for (const s of songsList) {
            await storage.putOne('songs', s);
          }
        }
      }

      if (statusEl) statusEl.textContent = '2/4. Скачивание списков и заметок...';
      try {
        const plRes = await fetch('./data/playlists.csv?_t=' + Date.now(), { cache: 'no-store' });
        if (plRes.ok) {
          const pls = CsvHelper.parse(await plRes.text());
          for (const p of pls) await storage.putOne('playlists', p);
        }
        const plItemsRes = await fetch('./data/playlist_items.csv?_t=' + Date.now(), { cache: 'no-store' });
        if (plItemsRes.ok) {
          const its = CsvHelper.parse(await plItemsRes.text());
          for (const it of its) await storage.putOne('playlistItems', it);
        }
      } catch(e) {}

      if (statusEl) statusEl.textContent = '3/4. Обновление Service Worker кэша...';
      if ('serviceWorker' in navigator) {
        const reg = await navigator.serviceWorker.getRegistration();
        if (reg) await reg.update();
      }

      // Сохраняем новую версию метаданных в IndexedDB
      await storage.saveSetting('app_version_meta', info.remote);
      await storage.saveSetting('db_initialized', 'true');
      AppLogger.info('UPDATE', 'Обновление базы успешно завершено: ' + (info.remote.app_build || 'v4.1.0'));

      if (statusEl) statusEl.textContent = '4/4. ✓ Успешно обновлено! Перезагрузка...';
      setTimeout(() => {
        window.location.reload();
      }, 800);
    } catch(err) {
      AppLogger.error('UPDATE', 'Ошибка обновления: ' + err.message);
      if (statusEl) statusEl.textContent = 'Ошибка обновления: ' + err.message;
      if (updateBtn) updateBtn.disabled = false;
    }
  }
}

    const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
    if (isStandalone && document.documentElement.requestFullscreen && !document.fullscreenElement) {
      document.addEventListener('click', () => {

      };
      playlists.push(tempPl);
      await storage.saveBatch('playlists', playlists);
    } else {
      tempPl.title = 'Подбор';
      tempPl.is_archived = '0';
    }

    // Сортировка: "Подбор" ВСЕГДА ПЕРВЫЙ, остальные списки по дате изменения
    playlists.sort((a, b) => {
      if (a.id === 'pl-temp') return -1;
      if (b.id === 'pl-temp') return 1;
      return new Date(b.updated_at || b.date) - new Date(a.updated_at || a.date);
    });

    this.searchEngine = new SearchEngine(songs);
    store.setState({
      songs, tags, songTags, audio, playlists, playlistItems
    });
  }

  setupKeyboardAndPedals() {
    window.addEventListener('keydown', (e) => {
      const overlay = document.getElementById('concert-overlay');
      if (overlay && !overlay.classList.contains('hidden')) {
        if (e.key === 'PageDown' || e.key === 'ArrowRight' || e.key === 'ArrowDown') {
          e.preventDefault();
          this.nextConcertSong();
        } else if (e.key === 'PageUp' || e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
          e.preventDefault();
          this.prevConcertSong();
        } else if (e.key === ' ' || e.code === 'Space') {
          e.preventDefault();
          this.toggleAutoScroll();
        } else if (e.key === 'Escape') {
          this.exitConcertMode();
        }
      }
    });

    setupConcertTouchGestures() {
    const overlay = document.getElementById('concert-overlay');
    if (!overlay) return;

    let touchStartX = 0;
    let touchStartY = 0;
    let initialPinchDist = 0;
    let initialFontSize = 1.6;

    overlay.addEventListener('touchstart', (e) => {
      if (e.touches.length === 1) {
        touchStartX = e.touches[0].clientX;
        touchStartY = e.touches[0].clientY;
      } else if (e.touches.length === 2) {
        initialPinchDist = Math.hypot(
          e.touches[0].clientX - e.touches[1].clientX,
          e.touches[0].clientY - e.touches[1].clientY
        );
        initialFontSize = store.getState().concertFontSize || 1.6;
      }
    }, { passive: true });

    overlay.addEventListener('touchmove', (e) => {
      if (e.touches.length === 2 && initialPinchDist > 0) {
        const currentDist = Math.hypot(
          e.touches[0].clientX - e.touches[1].clientX,
          e.touches[0].clientY - e.touches[1].clientY
        );
        const scale = currentDist / initialPinchDist;
        const newSize = Math.max(1.1, Math.min(3.2, initialFontSize * scale));
        store.setState({ concertFontSize: newSize });
        document.documentElement.style.setProperty('--font-concert', newSize + 'rem');
      }
    }, { passive: true });

    overlay.addEventListener('touchend', (e) => {
      if (e.changedTouches.length === 1 && initialPinchDist === 0) {
        const dx = e.changedTouches[0].clientX - touchStartX;
        const dy = e.changedTouches[0].clientY - touchStartY;
        // Горизонтальный свайп для перехода между песнями в режиме концерта
        if (Math.abs(dx) > 60 && Math.abs(dy) < 50) {
          if (dx < -60) {
            // Свайп влево -> следующая песня
            this.nextConcertSong();
          } else if (dx > 60) {
            // Свайп вправо -> предыдущая песня
            this.prevConcertSong();
          }
        }
      }
      if (e.touches.length === 0) {
        initialPinchDist = 0;
      }
    }, { passive: true });
  }

  setupDelegatedEvents() {
    document.addEventListener('click', (e) => {
      // Игнорируем клики внутри <select>, чтобы браузер не схлопывал выпадающее меню
      if (e.target.tagName === 'SELECT' || e.target.closest('select')) return;
      const actionEl = e.target.closest('[data-action]');
      if (!actionEl) return;
      const action = actionEl.dataset.action;
      this.handleAction(action, actionEl, e);
    });

    document.addEventListener('change', (e) => {
      const action = e.target.dataset.action;
      if (action === 'select-profile-dropdown') {
        const prof = e.target.value;
        storage.saveSetting('currentProfile', prof);
        store.setState({ currentProfile: prof });
        if (prof === 'none') {
          AppController.showToast('Режим: Слушатель (по умолчанию)');
        } else {
          AppController.showToast('Выбран профиль: ' + MUSICIAN_PROFILES.find(p => p.id === prof)?.label);
        }
      } else if (action === 'select-song-profile-tab') {
        const prof = e.target.value;
        storage.saveSetting('currentProfile', prof);
        store.setState({ currentProfile: prof });
        this.updateSongNotesArea();
      } else if (action === 'change-player-source') {
        const src = e.target.value;
        store.setState({ playerSource: src });
        this.loadSourceIntoPlayer(src);
      } else if (action === 'change-active-playlist') {
        const plId = e.target.value;
        storage.saveSetting('currentPlaylistId', plId);
        store.setState({ currentPlaylistId: plId });
        AppController.showToast('Активный список изменён');
      }
    });

    document.getElementById('input-import-playlist-file')?.addEventListener('change', (e) => {
      if (e.target.files.length) {
        this.handleImportPlaylistFile(e.target.files[0]);
        e.target.value = '';
      }
    });

    document.getElementById('input-sync-project-folder')?.addEventListener('change', async (e) => {
      if (e.target.files && e.target.files.length) {
        await this.processProjectFolderFiles(e.target.files);
        e.target.value = '';
      }
    });

    document.getElementById('input-import-songs-csv')?.addEventListener('change', async (e) => {
      if (e.target.files.length) {
        const file = e.target.files[0];
        try {
          AppLogger.info('SONGS_CSV_IMPORT', 'Чтение файла: ' + file.name + ' (' + file.size + ' байт)');
          const text = await file.text();
          const parsedSongs = CsvHelper.parse(text);
          if (parsedSongs && parsedSongs.length > 0) {
            await storage.saveBatch('songs', parsedSongs);
            store.setState({ songs: parsedSongs });
            this.searchEngine.updateIndex(parsedSongs);
            AppLogger.info('SONGS_CSV_IMPORT', 'Успешно обновлен каталог: ' + parsedSongs.length + ' песен');
            AppController.showToast('Каталог песен успешно обновлен: ' + parsedSongs.length + ' песен!');
            this.renderCurrentView();
          } else {
            AppLogger.error('SONGS_CSV_IMPORT', 'В файле не найдено корректных строк');
            AppController.showToast('Ошибка: файл не содержит строк с песнями');
          }
        } catch (err) {
          AppLogger.error('SONGS_CSV_IMPORT', 'Ошибка парсинга CSV: ' + err.message);
          AppController.showToast('Ошибка загрузки songs.csv: ' + err.message);
        }
        e.target.value = '';
      }
    });

    document.addEventListener('input', (e) => {
      if (e.target.id === 'player-volume-slider') {
        audioPlayer.setVolume(parseFloat(e.target.value));
        return;
      }
      if (e.target.id === 'search-input') {
        clearTimeout(this.debounceTimer);
        const query = e.target.value;
        this.debounceTimer = setTimeout(() => {
          this.catalogLimit = 60;
          store.state.searchQuery = query; // локально в state без полного ре-рендера представления
          this.updateCatalogResultsOnly();
        }, 150);
      }
    });

    const pWrap = document.getElementById('player-progress-wrap');
    if (pWrap) {
      pWrap.addEventListener('click', (e) => {
        const rect = pWrap.getBoundingClientRect();
        const clickX = e.clientX - rect.left;
        const pct = Math.max(0, Math.min(1, clickX / rect.width));
        audioPlayer.seekPercent(pct);
      });
    }

    // СВАЙП / ПЕРЕТЯГИВАНИЕ ВПРАВО ДЛЯ ДОБАВЛЕНИЯ ПЕСНИ В СПИСОК (375px адаптивный)
    let touchStartX = 0;
    let touchStartY = 0;
    let swipedSongCard = null;
    let isHorizontalSwipe = false;
    let swipeTriggered = false;

    document.addEventListener('touchstart', (e) => {
      const card = e.target.closest('.song-card');
      if (card && !e.target.closest('button')) {
        touchStartX = e.touches[0].clientX;
        touchStartY = e.touches[0].clientY;
        swipedSongCard = card;
        isHorizontalSwipe = false;
        swipeTriggered = false;
      } else {
        swipedSongCard = null;
      }
    }, { passive: true });

    document.addEventListener('touchmove', (e) => {
      if (!swipedSongCard) return;
      const dx = e.touches[0].clientX - touchStartX;
      const dy = e.touches[0].clientY - touchStartY;

      if (!isHorizontalSwipe && Math.abs(dy) > 25) {
        // Вертикальная прокрутка списка
        swipedSongCard.style.transform = '';
        swipedSongCard.style.backgroundColor = '';
        swipedSongCard = null;
        return;
      }

      if (dx > 15) {
        isHorizontalSwipe = true;
        swipedSongCard.style.transition = 'none';
        swipedSongCard.style.transform = 'translateX(' + Math.min(dx, 90) + 'px)';
        swipedSongCard.style.backgroundColor = 'var(--badge-bg)';
      }
    }, { passive: true });

    document.addEventListener('touchend', (e) => {
      if (!swipedSongCard) return;
      const dx = e.changedTouches[0].clientX - touchStartX;
      const dy = e.changedTouches[0].clientY - touchStartY;

      swipedSongCard.style.transition = 'transform 0.2s ease, background-color 0.2s ease';
      swipedSongCard.style.transform = '';
      swipedSongCard.style.backgroundColor = '';

      if (isHorizontalSwipe && dx > 45 && Math.abs(dy) < 40) {
        swipeTriggered = true;
        const songId = swipedSongCard.dataset.songId || swipedSongCard.getAttribute('data-drag-song-id');
        if (songId) {
          this.addSongToPlaylist(songId, store.getState().currentPlaylistId);
        }
      }

      setTimeout(() => {
        swipedSongCard = null;
        swipeTriggered = false;
        isHorizontalSwipe = false;
      }, 100);
    }, { passive: true });

    document.addEventListener('dragstart', (e) => {
      const plCard = e.target.closest('[data-drag-playlist-id]');
      if (plCard) {
        this.draggedType = 'playlist-card';
        this.draggedPlaylistCardId = plCard.dataset.dragPlaylistId;
        e.dataTransfer.setData('text/plain', this.draggedPlaylistCardId);
        e.dataTransfer.effectAllowed = 'move';
        plCard.classList.add('dragging');
        return;
      }

      const songCard = e.target.closest('[data-drag-song-id]');
      if (songCard) {
        this.draggedType = 'song';
        this.draggedSongId = songCard.getAttribute('data-drag-song-id') || songCard.dataset.dragSongId;
        e.dataTransfer.setData('text/plain', this.draggedSongId);
        e.dataTransfer.effectAllowed = 'copy';
        songCard.classList.add('dragging');
        const dropZone = document.getElementById('playlist-drop-zone');
        if (dropZone) dropZone.classList.add('drag-active');
        return;
      }

      const row = e.target.closest('[data-drag-index]');
      if (row) {
        this.draggedType = 'playlist-item';
        this.draggedPlaylistIndex = parseInt(row.dataset.dragIndex, 10);
        e.dataTransfer.setData('text/plain', this.draggedPlaylistIndex);
        e.dataTransfer.effectAllowed = 'move';
        row.classList.add('dragging');
      }
    });

    document.addEventListener('dragend', (e) => {
      document.querySelectorAll('.dragging').forEach(el => el.classList.remove('dragging'));
      const dropZone = document.getElementById('playlist-drop-zone');
      if (dropZone) dropZone.classList.remove('drag-active');
      document.querySelectorAll('.drag-over').forEach(el => el.classList.remove('drag-over'));
      this.draggedType = null;
      this.draggedSongId = null;
      this.draggedPlaylistIndex = null;
      this.draggedPlaylistCardId = null;
    });

    document.addEventListener('dragover', (e) => {
      const plCard = e.target.closest('[data-drag-playlist-id]');
      if (plCard && this.draggedType === 'playlist-card') {
        e.preventDefault();
        e.dataTransfer.dropEffect = 'move';
        plCard.classList.add('drag-over');
        return;
      }

      const dropZone = e.target.closest('#playlist-drop-zone');
      const row = e.target.closest('[data-drag-index]');

      if (dropZone || row) {
        e.preventDefault();
        e.dataTransfer.dropEffect = this.draggedType === 'song' ? 'copy' : 'move';
      }

      if (row && this.draggedType === 'playlist-item') {
        row.classList.add('drag-over');
      }
    });

    document.addEventListener('dragleave', (e) => {
      const plCard = e.target.closest('[data-drag-playlist-id]');
      if (plCard) plCard.classList.remove('drag-over');

      const row = e.target.closest('[data-drag-index]');
      if (row) row.classList.remove('drag-over');
    });

    document.addEventListener('drop', (e) => {
      const targetPlCard = e.target.closest('[data-drag-playlist-id]');
      if (targetPlCard && this.draggedType === 'playlist-card' && this.draggedPlaylistCardId) {
        e.preventDefault();
        targetPlCard.classList.remove('drag-over');
        const targetPlId = targetPlCard.dataset.dragPlaylistId;
        this.reorderPlaylists(this.draggedPlaylistCardId, targetPlId);
        return;
      }

      const dropZone = e.target.closest('#playlist-drop-zone');
      const row = e.target.closest('[data-drag-index]');

      if (!dropZone && !row) return;
      e.preventDefault();

      if (row) row.classList.remove('drag-over');
      if (dropZone) dropZone.classList.remove('drag-active');

      if (this.draggedType === 'song' && this.draggedSongId) {
        let insertIndex = undefined;
        if (row) insertIndex = parseInt(row.dataset.dragIndex, 10);
        this.addSongToPlaylist(this.draggedSongId, store.getState().currentPlaylistId, insertIndex);
      } else if (this.draggedType === 'playlist-item' && this.draggedPlaylistIndex !== null && row) {
        const targetIdx = parseInt(row.dataset.dragIndex, 10);
        this.reorderPlaylistItem(this.draggedPlaylistIndex, targetIdx);
      }
    });
  }

    openConcertMode(playlistId, startIndex = 0) {
    audioPlayer.pause();
    const docked = document.getElementById('docked-player');
    if (docked) docked.style.display = 'none';

    const state = store.getState();
    const curPlaylist = (state.playlists && state.playlists.find(p => p.id === playlistId)) || (state.playlists && state.playlists[0]) || { id: 'pl-temp', title: 'Подбор' };
    const items = (state.playlistItems || [])
      .filter(it => it.playlist_id === curPlaylist.id)
      .sort((a, b) => parseInt(a.order, 10) - parseInt(b.order, 10));

    if (items.length === 0) {
      AppController.showToast('Этот список пуст');
      return;
    }

    store.setState({
      concertPlaylistId: curPlaylist.id,
      concertIndex: startIndex,
      isAutoScrolling: false
    });

    const overlay = document.getElementById('concert-overlay');
    if (overlay) {
      overlay.classList.remove('hidden');
      document.body.style.overflow = 'hidden';
      this.renderConcertSong();
    }
  }

  openConcertSingleSong(songId) {
    const state = store.getState();
    const targetId = songId || state.currentSongId;
    audioPlayer.pause();
    const docked = document.getElementById('docked-player');
    if (docked) docked.style.display = 'none';

    const song = state.songs.find(s => s.id === targetId);
    if (!song) {
      AppLogger.warn('CONCERT', 'Песня не найдена по ID: ' + targetId);
      return;
    }

    store.setState({
      concertPlaylistId: null,
      concertSingleSongId: targetId,
      concertIndex: 0,
      isAutoScrolling: false
    });

    const overlay = document.getElementById('concert-overlay');
    if (overlay) {
      overlay.classList.remove('hidden');
      document.body.style.overflow = 'hidden';
      this.renderConcertSong();
    }
  }

  exitConcertMode() {
    this.stopAutoScroll();
    const overlay = document.getElementById('concert-overlay');
    if (overlay) {
      overlay.classList.add('hidden');
      document.body.style.overflow = '';
    }
    const state = store.getState();
    if (state.dockedPlayerVisible && state.currentTab !== 'player') {
      const docked = document.getElementById('docked-player');
      if (docked) docked.style.display = 'flex';
    }
  }

  renderConcertSong() {
    this.stopAutoScroll();
    const state = store.getState();
    let currentSong = null;
    let pagerText = '1 / 1';

    if (state.concertPlaylistId) {
      const curPlaylist = (state.playlists && state.playlists.find(p => p.id === state.concertPlaylistId)) || (state.playlists && state.playlists[0]) || { id: 'pl-temp', title: 'Подбор' };
      const items = (state.playlistItems || [])
        .filter(it => it.playlist_id === curPlaylist.id)
        .sort((a, b) => parseInt(a.order, 10) - parseInt(b.order, 10));
      const curItem = items[state.concertIndex] || items[0];
      if (curItem) {
        currentSong = state.songs.find(s => s.id === curItem.song_id);
      }
      pagerText = (state.concertIndex + 1) + ' / ' + items.length;
    } else if (state.concertSingleSongId) {
      currentSong = state.songs.find(s => s.id === state.concertSingleSongId);
      pagerText = '1 / 1';
    }

    if (!currentSong) return;

    const titleEl = document.getElementById('concert-song-title');
    const metaEl = document.getElementById('concert-song-meta');
    const pagerEl = document.getElementById('concert-pager-info');
    const bodyEl = document.getElementById('concert-body');

    if (titleEl) titleEl.textContent = currentSong.title;
    if (metaEl) {
      const state = store.getState();
      const useGerman = state.notation === 'H';
      const effKey = currentSong.key ? ChordTransposer.transposeChord(currentSong.key, this.currentSongTranspose || 0, useGerman) : '';
      const effCapo = currentSong.capo ? (String(currentSong.capo).startsWith('+') ? currentSong.capo : '+' + currentSong.capo) : '';
      const keyCapoShort = (effKey || '') + (effCapo || '');
      metaEl.textContent = keyCapoShort || '—';
    }
    if (pagerEl) pagerEl.textContent = pagerText;

    if (bodyEl) {
      bodyEl.innerHTML = '';
      Renderer.renderLyrics(bodyEl, currentSong, 0);
    }
  }

  toggleAutoScroll() {
    const state = store.getState();
    if (state.isAutoScrolling) {
      this.stopAutoScroll();
    } else {
      this.startAutoScroll();
    }
  }

  startAutoScroll() {
    store.setState({ isAutoScrolling: true });
    const btn = document.getElementById('btn-autoscroll');
    if (btn) {
      btn.textContent = '⏸ Пауза скролла';
      btn.classList.add('btn-primary');
    }

    const scrollContainer = document.getElementById('concert-body');
    if (!scrollContainer) return;

    const step = () => {
      if (!store.getState().isAutoScrolling) return;
      scrollContainer.scrollTop += 1;
      this.autoScrollAnimationId = requestAnimationFrame(step);
    };
    this.autoScrollAnimationId = requestAnimationFrame(step);
  }

  stopAutoScroll() {
    store.setState({ isAutoScrolling: false });
    const btn = document.getElementById('btn-autoscroll');
    if (btn) {
      btn.textContent = '▶ Скролл';
      btn.classList.remove('btn-primary');
    }
    if (this.autoScrollAnimationId) {
      cancelAnimationFrame(this.autoScrollAnimationId);
      this.autoScrollAnimationId = null;
    }
  }

    const state = store.getState();
    if (!state.concertPlaylistId) return;
    const items = state.playlistItems.filter(it => it.playlist_id === state.concertPlaylistId);
    if (state.concertIndex < items.length - 1) {
      store.setState({ concertIndex: state.concertIndex + 1 });
      this.renderConcertSong();
    }
  }

  prevConcertSong() {
    const state = store.getState();
    if (!state.concertPlaylistId) return;
    if (state.concertIndex > 0) {
      store.setState({ concertIndex: state.concertIndex - 1 });
      this.renderConcertSong();
    }
  }
async setupWakeLock() {

        this.currentSongTranspose = (this.currentSongTranspose || 0) + 1;
        this.renderConcertSong();
        break;
      }
      case 'concert-toggle-theme': {
        const themes = ['paper', 'amber', 'dark'];
        const curTheme = store.getState().concertTheme || 'paper';
        const nextTheme = themes[(themes.indexOf(curTheme) + 1) % themes.length];
        store.setState({ concertTheme: nextTheme });
        const overlay = document.getElementById('concert-overlay');
        if (overlay) overlay.dataset.concertTheme = nextTheme;
        AppController.showToast('Тема концерта: ' + nextTheme);
        break;
      }
      case 'concert-toggle-autoscroll':
        this.toggleAutoScroll();
        break;

      case 'concert-next-song':
        this.nextConcertSong();
        break;

      case 'concert-prev-song':
        this.prevConcertSong();
        break;

      case 'concert-font-plus': {
        const sz = Math.min(2.8, state.concertFontSize + 0.15);
        store.setState({ concertFontSize: sz });
        document.documentElement.style.setProperty('--font-concert', sz + 'rem');
        break;
      }

      case 'concert-font-minus': {
        const sz = Math.max(1.2, state.concertFontSize - 0.15);
        store.setState({ concertFontSize: sz });
        document.documentElement.style.setProperty('--font-concert', sz + 'rem');
        break;
      }

      case 'player-toggle-play':
        audioPlayer.togglePlay();
        break;

      case 'player-next-track':
        audioPlayer.playNext();
        break;

      case 'player-prev-track':
        audioPlayer.playPrev();
        break;

      case 'play-song-variant': {
        const audId = el.dataset.audioId;
        let track = state.audio.find(a => a.id === audId);
        // Треки берутся строго из актуального реестра state.audio
        if (track) {
          AppLogger.info('PLAYER', 'Воспроизведение варианта: ' + (track.filename || track.label));
          audioPlayer.playIsolatedTrack(track);
        }
        break;
      }

      case 'play-all-song-variants': {
        const songId = el.dataset.songId || state.currentSongId;
        const variants = state.audio.filter(a => a.song_id === songId);
        if (variants.length > 0) {
          audioPlayer.setQueue(variants, 0);
          AppController.showToast('Воспроизведение всех версий песни');
        } else {
          AppController.showToast('Для этой песни нет привязанных аудиофайлов');
        }
        break;
      }
    }
  }

  async reorderPlaylists(fromId, toId) {
    if (fromId === toId) return;
    const state = store.getState();
    const lists = [...state.playlists];
    const fromIdx = lists.findIndex(p => p.id === fromId);
    const toIdx = lists.findIndex(p => p.id === toId);
    if (fromIdx === -1 || toIdx === -1) return;

    undoManager.pushState('Перемещение списка', { playlists: state.playlists });

    const [moved] = lists.splice(fromIdx, 1);
    lists.splice(toIdx, 0, moved);

    await storage.saveBatch('playlists', lists);
    store.setState({ playlists: lists });
    AppController.showToast('Порядок списков обновлён!');
  }

  async touchPlaylistTimestamp(playlistId) {
    const state = store.getState();
    const lists = [...state.playlists];
    const pl = lists.find(p => p.id === playlistId);
    if (pl) {
      pl.updated_at = new Date().toISOString();
      await storage.saveBatch('playlists', lists);
      store.setState({ playlists: lists });
    }
  }

    // Счётчики типов для каждой песни, чтобы присваивать запись1, запись2... и сохранять ВСЕ файлы
    const typeCounters = {};

    for (const fname of candidateFiles) {
      const match = fname.match(/^0*([0-9]{1,4})[_-]([a-zA-Z0-9а-яА-ЯёЁ]+)[_-](.*)$/i);
      if (!match) {
        AppLogger.warn('AUDIO_SCAN', 'Файл не подошел под маску ID_TYPE_TITLE: ' + fname);
        continue;
      }

      const rawNum = parseInt(match[1], 10);
      const songId = rawNum.toString().padStart(4, '0');
      let rawType = match[2].toLowerCase();

      let baseType = 'альбом';
      if (rawType.startsWith('альбом') || rawType === 'studio') baseType = 'альбом';
      else if (rawType.startsWith('запись') || rawType === 'rehearsal' || rawType.startsWith('rep')) baseType = 'запись';
      else if (rawType.startsWith('минус') || rawType === 'chords' || rawType === 'minus') baseType = 'минус';
      else if (rawType.startsWith('импро') || rawType === 'live') baseType = 'импро';
      else baseType = rawType;

      const countKey = songId + '_' + baseType;
      typeCounters[countKey] = (typeCounters[countKey] || 0) + 1;
      const occurrence = typeCounters[countKey];
      // Если для этой песни уже есть трек данного типа, первый - 'запись' (без единицы), затем 'запись2', 'запись3'...
      const effectiveType = occurrence === 1 ? baseType : (baseType + occurrence);

      const song = state.songs.find(s => s.id === songId);
      const songTitle = song ? song.title : fname.slice(fname.lastIndexOf('_') + 1).replace(/.[^/.]+$/, '');
      const audioPath = 'music/' + fname;
      const audioId = 'aud-' + songId + '-' + effectiveType;

      const newTrack = {
        id: audioId,
        song_id: songId,
        label: songTitle,
        type: effectiveType,
        path: audioPath,
        url: audioPath,
        filename: fname,
        mime_type: 'audio/mpeg',
        artist: 'Огненный ветер',
        album: 'Сборник',
        year: '2026'
      };

      // Проверяем по уникальному имени файла (чтобы не перезатирать разные файлы одной песни!)
      const existingIdx = updatedAudio.findIndex(a => a.path === audioPath || a.filename === fname);
      if (existingIdx !== -1) {
        updatedAudio[existingIdx] = newTrack;
      } else {
        updatedAudio.push(newTrack);
      }
      matchedCount++;
    }

    // Сохранение в базу IndexedDB и обновление очереди плеера
    await storage.saveBatch('audio', updatedAudio);
    store.setState({ audio: updatedAudio });

    if (audioPlayer.playlistQueue.length === 0 || audioPlayer.playlistQueue.length <= candidateFiles.length) {
      audioPlayer.playlistQueue = updatedAudio;
      audioPlayer.currentTrack = updatedAudio[0] || null;
    }

    AppController.showToast('Фонограммы папки music/ успешно привязаны к песням (' + matchedCount + ' треков)!');
  }

    async processEntireProjectDirectory(dirHandle) {
    AppLogger.info('FOLDER_SYNC', 'Сканирование структуры папки проекта...');
    let foundSongsFile = null;
    let foundMusicFiles = [];

    async function traverse(handle, path = '') {
      for await (const entry of handle.values()) {
        const fullPath = path ? (path + '/' + entry.name) : entry.name;
        if (entry.kind === 'file') {
          if (entry.name.toLowerCase() === 'songs.csv') {
            foundSongsFile = await entry.getFile();
          } else if (entry.name.toLowerCase().endsWith('.mp3')) {
            foundMusicFiles.push(await entry.getFile());
          }
        } else if (entry.kind === 'directory') {
          await traverse(entry, fullPath);
        }
      }
    }

    try {
      await traverse(dirHandle);
      await this.applyProjectFolderUpdates(foundSongsFile, foundMusicFiles);
    } catch (err) {
      AppLogger.error('FOLDER_SYNC', 'Ошибка сканирования папки: ' + err.message);
      AppController.showToast('Ошибка сканирования папки: ' + err.message);
    }
  }

  async processProjectFolderFiles(fileList) {
    AppLogger.info('FOLDER_SYNC', 'Обработка выбранных файлов проекта (' + fileList.length + ' файлов)...');
    let foundSongsFile = null;
    let foundMusicFiles = [];

    for (let i = 0; i < fileList.length; i++) {
      const f = fileList[i];
      if (f.name.toLowerCase() === 'songs.csv') {
        foundSongsFile = f;
      } else if (f.name.toLowerCase().endsWith('.mp3')) {
        foundMusicFiles.push(f);
      }
    }
    await this.applyProjectFolderUpdates(foundSongsFile, foundMusicFiles);
  }

  async applyProjectFolderUpdates(songsFile, musicFiles) {
    let reportParts = [];

    // Предупреждение пользователю о фоновой обработке базы
    const loaderToast = document.createElement('div');
    loaderToast.className = 'toast-msg';
    loaderToast.style.cssText = 'background: #c03000; color: #fff; font-weight: bold; border: 2px solid #fff; box-shadow: 0 4px 20px rgba(0,0,0,0.5); z-index: 99999; width: 90%; max-width: 420px;';
    loaderToast.innerHTML = '⏳ <strong>Идёт загрузка и связывание песен и фонограмм...</strong><br><span style="font-size:0.85rem; font-weight:normal;">На телефоне обработка сотен файлов занимает 1–2 минуты. Пожалуйста, не закрывайте вкладку.</span>';
    const toastCont = document.getElementById('toast-container');
    if (toastCont) toastCont.appendChild(loaderToast);

    if (songsFile) {
      try {
        AppLogger.info('FOLDER_SYNC', 'Чтение найденного songs.csv...');
        const text = await songsFile.text();
        const parsed = CsvHelper.parse(text);
        if (parsed && parsed.length > 0) {
          await storage.saveBatch('songs', parsed);
          store.setState({ songs: parsed });
          this.searchEngine.updateIndex(parsed);
          reportParts.push('Песен в каталоге: ' + parsed.length);
          AppLogger.info('FOLDER_SYNC', 'Каталог песен успешно обновлен: ' + parsed.length);
        }
      } catch (err) {
        AppLogger.error('FOLDER_SYNC', 'Ошибка чтения songs.csv: ' + err.message);
      }
    }

    if (musicFiles && musicFiles.length > 0) {
      await this.handleBatchAudioUpload(musicFiles);
      reportParts.push('Фонограмм привязано: ' + musicFiles.length);
      AppLogger.info('FOLDER_SYNC', 'Фонограммы привязаны: ' + musicFiles.length);
    }

    if (loaderToast && loaderToast.parentNode) {
      loaderToast.parentNode.removeChild(loaderToast);
    }

    if (reportParts.length > 0) {
      AppController.showToast('Синхронизировано! ' + reportParts.join(' • '));
      this.renderCurrentView();
    } else {
      AppController.showToast('В выбранной папке не найдены songs.csv или mp3 файлы');
    }
  }

async handleBatchAudioUpload(files) {
    if (!files || files.length === 0) return;
    if (!window._audioFilesRegistry) window._audioFilesRegistry = new Map();
    for (let fIdx = 0; fIdx < files.length; fIdx++) {
      window._audioFilesRegistry.set(files[fIdx].name, files[fIdx]);
    }
    const state = store.getState();
    const updatedAudio = [...state.audio];
    let matchedCount = 0;

    for (let i = 0; i < files.length; i++) {
      const file = files[i];
      const fname = file.name;

      const match = fname.match(/^0*([0-9]{1,4})[_-]([a-zA-Z0-9а-яА-ЯёЁ]+)[_-](.*)$/i);
      if (!match) {
        AppLogger.warn('AUDIO_SCAN', 'Файл не подошел под маску ID_TYPE_TITLE: ' + fname);
        continue;
      }

      const rawNum = parseInt(match[1], 10);
      const songId = rawNum.toString().padStart(4, '0');
      let rawType = match[2].toLowerCase();

      // Нормализация к единым русским типам: альбом, запись, минус, импро
      let baseType = 'альбом';
      if (rawType.startsWith('альбом') || rawType === 'studio') baseType = 'альбом';
      else if (rawType.startsWith('запись') || rawType === 'rehearsal' || rawType.startsWith('rep')) baseType = 'запись';
      else if (rawType.startsWith('минус') || rawType === 'chords' || rawType === 'minus') baseType = 'минус';
      else if (rawType.startsWith('импро') || rawType === 'live') baseType = 'импро';
      else baseType = rawType;

      // Если тип уже имел цифру (например запись2), сохраняем её
      let effectiveType = rawType;
      if (!/d+$/.test(rawType)) {
        effectiveType = baseType;
      }

      const song = state.songs.find(s => s.id === songId);
      if (!song) continue;

      const fileUrl = URL.createObjectURL(file);
      const audioId = 'aud-' + songId + '-' + effectiveType + '-' + i;
      const typeLabels = {
        'альбом': 'Студийная оригинальная запись',
        'запись': 'Репетиционная дорожка / демка',
        'минус': 'Инструментал (минус без слов)',
        'импро': 'Концертная импровизация (live)'
      };

      const newTrack = {
        id: audioId,
        song_id: songId,
        label: song.title || typeLabels[baseType] || effectiveType,
        type: effectiveType,
        path: 'music/' + fname,
        url: fileUrl,
        filename: fname,
        mime_type: file.type || 'audio/mpeg',
        artist: 'Огненный ветер',
        album: 'Сборник',
        year: '2026'
      };

      // Проверяем по имени файла или пути, чтобы не перезатирать разные файлы одной песни!
      const existingIdx = updatedAudio.findIndex(a => a.filename === fname || a.path === ('music/' + fname));
      if (existingIdx !== -1) {
        updatedAudio[existingIdx] = newTrack;
      } else {
        updatedAudio.push(newTrack);
      }
      matchedCount++;
    }

    if (matchedCount > 0) {
      await storage.saveBatch('audio', updatedAudio);
      store.setState({ audio: updatedAudio });
      AppController.showToast('Связано треков: ' + matchedCount + '. Сохраняем звук в память телефона...');

      // Асинхронное фоновое сохранение бинарных аудиофайлов в постоянную IndexedDB
      (async () => {
        let savedBlobs = 0;
        for (let bIdx = 0; bIdx < files.length; bIdx++) {
          const f = files[bIdx];
          if (f.name.toLowerCase().endsWith('.mp3')) {
            const ok = await storage.saveAudioBlob(f.name, f);
            if (ok) savedBlobs++;
          }
        }
        AppLogger.info('AUDIO_STORE', 'Сохранено аудиофайлов в локальную постоянную память: ' + savedBlobs);
      })();
    } else {
      AppController.showToast('Не найдено файлов формата ID_type_title (напр. 0482_studio_название.mp3)');
    }
  }

  loadPlaylistIntoPlayer(playlistId) {
    const state = store.getState();
    const pl = state.playlists.find(p => p.id === playlistId);
    if (!pl) return;

    const items = state.playlistItems
      .filter(it => it.playlist_id === playlistId)
      .sort((a, b) => parseInt(a.order, 10) - parseInt(b.order, 10));

    if (items.length === 0) {
      AppController.showToast('В этом списке пока нет песен');
      return;
    }

    const collectedAudio = [];
    for (const item of items) {
      const audios = state.audio.filter(a => a.song_id === item.song_id);
      collectedAudio.push(...audios);
    }

    if (collectedAudio.length === 0) {
      AppController.showToast('В песнях этого списка нет аудиозаписей');
      return;
    }

    store.setState({ playerSource: playlistId });
    audioPlayer.setQueue(collectedAudio, 0);
    AppController.showToast('В плеер загружен список "' + pl.title + '" (' + collectedAudio.length + ' треков)');
  }

  async addSongToPlaylist(songId, playlistId, insertIndex = undefined) {
    const state = store.getState();
    undoManager.pushState('Добавление песни в список', { playlistItems: state.playlistItems });

    const curItems = state.playlistItems
      .filter(it => it.playlist_id === playlistId)
      .sort((a, b) => parseInt(a.order, 10) - parseInt(b.order, 10));

    const newItem = {
      playlist_id: playlistId,
      order: '0',
      song_id: songId,
      transpose: '0',
      capo_override: '',
      audio_variant_id: '',
      note: ''
    };

    if (insertIndex !== undefined && insertIndex >= 0 && insertIndex <= curItems.length) {
      curItems.splice(insertIndex, 0, newItem);
    } else {
      curItems.push(newItem);
    }

    curItems.forEach((it, idx) => { it.order = (idx + 1).toString(); });

    const otherItems = state.playlistItems.filter(it => it.playlist_id !== playlistId);
    const updated = [...otherItems, ...curItems];

    await storage.saveBatch('playlistItems', updated);
    store.setState({ playlistItems: updated });
    await this.touchPlaylistTimestamp(playlistId);

    const s = state.songs.find(x => x.id === songId);
    AppController.showToast('Песня "' + (s ? s.title : songId) + '" добавлена в список!');
  }

  async removePlaylistItem(itemIndex) {
    const state = store.getState();
    undoManager.pushState('Удаление песни из списка', { playlistItems: state.playlistItems });

    const curItems = state.playlistItems
      .filter(it => it.playlist_id === state.currentPlaylistId)
      .sort((a, b) => parseInt(a.order, 10) - parseInt(b.order, 10));

    if (itemIndex < 0 || itemIndex >= curItems.length) return;

    const otherItems = state.playlistItems.filter(it => it.playlist_id !== state.currentPlaylistId);
    const remainingInCur = curItems.filter((_, idx) => idx !== itemIndex);

    remainingInCur.forEach((it, idx) => { it.order = (idx + 1).toString(); });

    const updated = [...otherItems, ...remainingInCur];
    await storage.saveBatch('playlistItems', updated);
    store.setState({ playlistItems: updated });
    await this.touchPlaylistTimestamp(state.currentPlaylistId);
    AppController.showToast('Песня удалена из списка');
  }

  async reorderPlaylistItem(fromIndex, toIndex) {
    const state = store.getState();
    undoManager.pushState('Изменение порядка песен', { playlistItems: state.playlistItems });

    const curItems = state.playlistItems
      .filter(it => it.playlist_id === state.currentPlaylistId)
      .sort((a, b) => parseInt(a.order, 10) - parseInt(b.order, 10));

    if (fromIndex < 0 || fromIndex >= curItems.length || toIndex < 0 || toIndex >= curItems.length) return;

    const [moved] = curItems.splice(fromIndex, 1);
    curItems.splice(toIndex, 0, moved);

    curItems.forEach((it, idx) => { it.order = (idx + 1).toString(); });

    const otherItems = state.playlistItems.filter(it => it.playlist_id !== state.currentPlaylistId);
    const updated = [...otherItems, ...curItems];
    await storage.saveBatch('playlistItems', updated);
    store.setState({ playlistItems: updated });
    await this.touchPlaylistTimestamp(state.currentPlaylistId);
  }

      if (s.notes && s.notes.trim()) {
        taggedNotesMap[s.id] = s.notes;
      }

    const data = {

      exported_at: new Date().toISOString(),
      taggedSongNotes: taggedNotesMap,
      customPlaylists: state.playlists.filter(p => p.id.startsWith('pl-') && p.id !== 'pl-001'),

    };
    const jsonStr = JSON.stringify(data, null, 2);

    this.downloadFile(jsonStr, filename, 'application/json');
    AppController.showToast('Файл базы заметок сохранён! Отправьте его админу.');
  }

  downloadFile(content, filename, type) {
    const blob = new Blob([content], { type });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    setTimeout(() => {
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }, 100);
  }

      backBtn.classList.remove('hidden');
      document.body.classList.add('viewing-song-detail');

    if (navUndoBtn) {
      if (isSongDetail) navUndoBtn.classList.remove('hidden');
      else navUndoBtn.classList.add('hidden');
    }

    const dockedPlayerEl = document.getElementById('docked-player');
    if (dockedPlayerEl) {
      if (state.currentTab === 'player' || !state.dockedPlayerVisible) {
        dockedPlayerEl.style.display = 'none';
      } else {
        dockedPlayerEl.style.display = 'flex';
      }
    }

    const playIcon = document.getElementById('icon-play');
    const pauseIcon = document.getElementById('icon-pause');
    const dockedPlayBtn = document.getElementById('btn-docked-play');
    const hasTrack = !!(audioPlayer.currentTrack || (audioPlayer.playlistQueue && audioPlayer.playlistQueue.length > 0));

    if (dockedPlayBtn) {
      dockedPlayBtn.disabled = !hasTrack;
      dockedPlayBtn.style.opacity = hasTrack ? '1' : '0.4';
      dockedPlayBtn.style.cursor = hasTrack ? 'pointer' : 'not-allowed';
    }

    if (playIcon && pauseIcon) {
      if (state.isPlaying) {
        playIcon.classList.add('hidden');
        pauseIcon.classList.remove('hidden');
      } else {
        playIcon.classList.remove('hidden');
        pauseIcon.classList.add('hidden');
      }
    }

    const mainPlayBtn = document.getElementById('main-play-btn');
    if (mainPlayBtn) {
      mainPlayBtn.disabled = !hasTrack;
      mainPlayBtn.style.opacity = hasTrack ? '1' : '0.4';
      mainPlayBtn.style.cursor = hasTrack ? 'pointer' : 'not-allowed';
    }

    const mainPlayIcon = document.getElementById('main-play-icon');
    const mainPauseIcon = document.getElementById('main-pause-icon');
    if (mainPlayIcon && mainPauseIcon) {
      if (state.isPlaying) {
        mainPlayIcon.classList.add('hidden');
        mainPauseIcon.classList.remove('hidden');
      } else {
        mainPlayIcon.classList.remove('hidden');
        mainPauseIcon.classList.add('hidden');
      }
    }

    this.renderCurrentView();
  }

  renderCurrentView() {
    const state = store.getState();
    const main = document.getElementById('main-content');
    const pageTitle = document.getElementById('page-title');
    const headerActions = document.getElementById('header-actions');
    headerActions.innerHTML = '';

    if (undoManager.canUndo()) {
      const undoBtn = Renderer.createElement('button', {
        className: 'btn btn-outline btn-sm',
        dataset: { action: 'undo-last-change' },
        title: 'Отменить последнее изменение'
      }, ['↶']);
      headerActions.appendChild(undoBtn);
    }

    if (state.currentTab === 'catalog') {
      if (state.currentSongId) {
        const song = state.songs.find(s => s.id === state.currentSongId);
        if (song) {
          pageTitle.textContent = song.title;
          this.renderSongDetailView(main, song, headerActions);
          return;
        }
      }
      pageTitle.textContent = 'Песни и Список';
      this.renderCatalogView(main);
    } else if (state.currentTab === 'playlists') {
      pageTitle.textContent = 'Управление Списками';
      this.renderPlaylistsView(main, headerActions);
    } else if (state.currentTab === 'player') {
      pageTitle.textContent = 'Студийный Плеер';
      this.renderDedicatedPlayerView(main);
    } else if (state.currentTab === 'settings') {
      pageTitle.textContent = 'Опции и Заметки';
      this.renderSettingsView(main);
    }
  }

  // ============================================================
  // ДВУХКОЛОНОЧНЫЙ ЭКРАН ПЕСЕН С МОБИЛЬНЫМ ПЕРЕКЛЮЧАТЕЛЕМ
  // ============================================================
    renderCatalogSongCards(listWrap, results, state) {
    listWrap.innerHTML = '';
    if (!results || results.length === 0) {
      const emptyMsg = Renderer.createElement('div', {
        className: 'empty-state-card',
        style: 'padding: 2rem; text-align: center; color: var(--text-muted);'
      }, ['Ничего не найдено по вашему запросу']);
      listWrap.appendChild(emptyMsg);
      return;
    }

    const displayChunk = results.slice(0, this.catalogLimit);

    for (const song of displayChunk) {
      const card = Renderer.createElement('div', {
        className: 'song-card',
        draggable: true,
        'data-drag-song-id': song.id,
        dataset: { action: 'open-song', songId: song.id, dragSongId: song.id },
        style: 'display: flex; align-items: center; justify-content: space-between; gap: 0.25rem; width: 100%; box-sizing: border-box; min-width: 0;'
      });

      const info = Renderer.createElement('div', { className: 'song-card-info' });
      const titleRow = Renderer.createElement('div', { className: 'song-card-title flex items-center gap-2' });
      const titleSpan = Renderer.createElement('span');
      Renderer.renderHighlightedText(titleSpan, song.title, state.searchQuery);
      titleRow.appendChild(titleSpan);

      if (song.is_empty_body === 'true') {
        titleRow.appendChild(Renderer.createElement('span', {
          className: 'badge-empty-body text-xs',
          style: 'font-size: 0.72rem; padding: 2px 6px; border-radius: 4px; background: rgba(120, 113, 108, 0.15); color: var(--text-muted);',
          title: 'Песня внесена в реестр, аккорды ожидаются'
        }, ['Только название']));
      }
      info.appendChild(titleRow);

      // Только если есть активный поиск — выводим аккуратный 2-строчный сниппет текста
      if (state.searchQuery && state.searchQuery.trim()) {
        const queryTerms = normalizeSearchText(state.searchQuery).split(' ').filter(Boolean);
        let snippetText = '';
        if (song.body_plain) {
          const bodyLower = song.body_plain.toLowerCase();
          for (const term of queryTerms) {
            const termIdx = bodyLower.indexOf(term);
            if (termIdx !== -1) {
              const start = Math.max(0, termIdx - 25);
              const end = Math.min(song.body_plain.length, termIdx + term.length + 50);
              snippetText = (start > 0 ? '… ' : '') + song.body_plain.slice(start, end).replace(/s+/g, ' ') + (end < song.body_plain.length ? ' …' : '');
              break;
            }
          }
        }
        if (snippetText) {
          const snipDiv = Renderer.createElement('div', {
            className: 'song-card-snippet'
          });
          Renderer.renderHighlightedText(snipDiv, snippetText, state.searchQuery);
          info.appendChild(snipDiv);
        }
      }
      card.appendChild(info);

      const metaWrap = Renderer.createElement('div', {
        className: 'song-card-meta',
        style: 'display: inline-flex; align-items: center; gap: 0.2rem; flex-shrink: 0; margin-left: auto;'
      });
      const keyCapoText = Renderer.formatKeyCapo(song.key, song.capo);
      if (keyCapoText) {
        metaWrap.appendChild(Renderer.createElement('span', {
          className: 'badge-key-capo',
          style: 'font-size: 0.72rem; padding: 2px 5px; flex-shrink: 0;'
        }, [keyCapoText]));
      }

      const addBtn = Renderer.createElement('button', {
        className: 'btn-icon-pure text-accent',
        style: 'font-size: 1.25rem; font-weight: 800; min-width: 28px; height: 28px; padding: 0; flex-shrink: 0;',
        dataset: { action: 'add-song-to-current-playlist', songId: song.id },
        title: 'Добавить в текущий сетлист'
      }, ['+']);
      metaWrap.appendChild(addBtn);

      card.appendChild(metaWrap);
      listWrap.appendChild(card);
    }

    if (results.length > this.catalogLimit) {
      const moreRow = Renderer.createElement('div', { style: 'padding: 0.75rem; text-align: center;' });
      const moreBtn = Renderer.createElement('button', {
        className: 'btn btn-outline btn-sm w-full',
        dataset: { action: 'catalog-show-more' }
      }, ['Показать ещё (' + (results.length - this.catalogLimit) + ' ост.)']);
      moreRow.appendChild(moreBtn);
      listWrap.appendChild(moreRow);
    }
  }

  renderSongDetailView(container, song, headerActions) {
    container.innerHTML = '';
    const state = store.getState();

    const printBtn = Renderer.createElement('button', {
      className: 'btn btn-outline btn-sm no-print',
      dataset: { action: 'print-song' },

    }, ['🖨 Печать']);

      className: 'btn btn-brick btn-sm no-print',
      dataset: { action: 'open-concert-single-song', songId: song.id }
    }, ['На сцену']);
    headerActions.appendChild(stageBtn);

    // 1. Верхняя строка
    const topBar = Renderer.createElement('div', { className: 'song-header-compact-bar' });
    topBar.appendChild(Renderer.createElement('div', { className: 'song-header-main-title' }, [song.title]));

    const paramsWrap = Renderer.createElement('div', { className: 'song-header-params' });
    paramsWrap.appendChild(Renderer.createElement('span', { className: 'badge-num' }, ['#' + song.id]));

    if (song.capo) {
      paramsWrap.appendChild(Renderer.createElement('span', { className: 'badge-key-capo' }, ['Капо: ' + song.capo]));
    }

    const transWrap = Renderer.createElement('div', { className: 'transpose-control-wrap' });
    const transDown = Renderer.createElement('button', { className: 'btn btn-icon btn-outline', dataset: { action: 'transpose-minus' } }, ['-1']);
    const currentTransVal = (this.currentSongTranspose > 0 ? '+' : '') + this.currentSongTranspose;
    const transVal = Renderer.createElement('span', { className: 'transpose-val', id: 'transpose-val-label' }, [
      song.key ? ChordTransposer.transposeChord(song.key, this.currentSongTranspose, state.notation === 'H') : currentTransVal
    ]);
    const transUp = Renderer.createElement('button', { className: 'btn btn-icon btn-outline', dataset: { action: 'transpose-plus' } }, ['+1']);
    transWrap.appendChild(transDown);
    transWrap.appendChild(transVal);
    transWrap.appendChild(transUp);
    paramsWrap.appendChild(transWrap);

    // Плюсик для добавления текущей песни в активный список сразу после блока транспонирования
    const addCurrentToPlaylistBtn = Renderer.createElement('button', {
      className: 'btn btn-primary btn-icon',
      style: 'font-weight: 800; font-size: 1.1rem; min-width: 34px; height: 34px; border-radius: 0.4rem; margin-left: auto; flex-shrink: 0;',
      dataset: { action: 'add-song-to-current-playlist', songId: song.id },
      title: 'Добавить эту песню в текущий список'
    }, ['+']);
    paramsWrap.appendChild(addCurrentToPlaylistBtn);

    topBar.appendChild(paramsWrap);
    container.appendChild(topBar);

    // 2. Текст с аккордами (инлайн-блоки слогов)
    const lyricsContainer = Renderer.createElement('div', { className: 'lyrics-container', id: 'lyrics-box' });
    Renderer.renderLyrics(lyricsContainer, song, this.currentSongTranspose);
    container.appendChild(lyricsContainer);

    // 3. Метаданные и заметки (с выпадающим списком ролей)
    const detailsBox = Renderer.createElement('div', { className: 'song-details-bottom-box' });
    detailsBox.appendChild(Renderer.createElement('strong', { className: 'text-main text-sm' }, ['Свойства и метаданные песни']));

    const propRow = Renderer.createElement('div', { className: 'property-row mt-2' });
    if (song.author) propRow.appendChild(Renderer.createElement('span', {}, ['Автор: ' + song.author]));
    if (song.key) propRow.appendChild(Renderer.createElement('span', {}, ['Основная тональность: ' + song.key]));
    if (song.tempo) propRow.appendChild(Renderer.createElement('span', {}, ['Темп: ' + song.tempo + ' BPM']));
    detailsBox.appendChild(propRow);

    // Выпадающий список выбора роли для заметки
    const roleSelectWrap = Renderer.createElement('div', { className: 'flex items-center gap-2 mt-2', style: 'flex-wrap: wrap;' });
    roleSelectWrap.appendChild(Renderer.createElement('span', { className: 'text-sm text-muted' }, ['Роль для заметки:']));

    const roleSelect = Renderer.createElement('select', {
      className: 'input-select text-sm',
      dataset: { action: 'select-song-profile-tab' },
      style: 'flex: 1; min-width: 200px;'
    });
    MUSICIAN_PROFILES.forEach(p => {
      const labelText = (state.currentProfile === 'none' && p.id === 'leader') ? 'Общие заметки (Лидер)' : p.label;
      const opt = Renderer.createElement('option', { value: p.id }, [labelText]);
      if ((state.currentProfile === 'none' && p.id === 'leader') || state.currentProfile === p.id) {
        opt.selected = true;
      }
      roleSelect.appendChild(opt);
    });
    roleSelectWrap.appendChild(roleSelect);
    detailsBox.appendChild(roleSelectWrap);

    const notesFields = Renderer.createElement('div', { className: 'flex mt-2', style: 'flex-direction: column; gap: 0.5rem;' });
    const effectiveProfile = (state.currentProfile === 'none') ? 'leader' : state.currentProfile;
    const currentNoteText = TaggedNotesHelper.getNoteForProfile(song.notes || '', effectiveProfile);

    const noteInput = Renderer.createElement('textarea', {
      id: 'input-profile-note',
      className: 'input-textarea',
      placeholder: 'Заметка для роли ' + MUSICIAN_PROFILES.find(p => p.id === effectiveProfile)?.label + ' (хранится в базе под тэгом [' + effectiveProfile + '])...',
      rows: 2
    }, [currentNoteText]);
    notesFields.appendChild(noteInput);

    const saveNoteBtn = Renderer.createElement('button', {
      className: 'btn btn-primary mt-2',
      dataset: { action: 'save-user-note' }
    }, ['Сохранить заметку роли']);
    notesFields.appendChild(saveNoteBtn);
    detailsBox.appendChild(notesFields);
    container.appendChild(detailsBox);

    // 4. Компактные аудиоверсии песни
    const normSongId = String(song.id).padStart(4, '0');
    const rawNumStr = String(parseInt(song.id, 10));

    // Поиск по всем возможным совпадениям: song_id с нулями, без нулей, либо по началу имени файла
    const checkAudioMatches = (track) => {
      const aSid = String(track.song_id || '');
      if (aSid.padStart(4, '0') === normSongId || aSid === rawNumStr) return true;
      if (track.filename && (track.filename.startsWith(normSongId + '_') || track.filename.startsWith(normSongId + '-'))) return true;
      return false;
    };

    let songAudios = state.audio.filter(checkAudioMatches);

    // Поиск треков исключительно среди реально загруженных пользователем файлов
    const audioCard = Renderer.createElement('div', { className: 'song-audio-bottom-hub', style: 'padding: 0.75rem 1rem;' });
    const audioHdr = Renderer.createElement('div', { className: 'flex items-center justify-between flex-wrap gap-2' }, [
      Renderer.createElement('strong', { className: 'text-main text-sm' }, ['Аудиозаписи (' + songAudios.length + ')']),
      Renderer.createElement('button', {
        className: 'btn btn-outline btn-sm',
        dataset: { action: 'play-all-song-variants', songId: song.id }
      }, ['▶ В плеер'])
    ]);
    audioCard.appendChild(audioHdr);

    if (songAudios.length > 0) {
      const grid = Renderer.createElement('div', { className: 'audio-variants-compact-row' });
      for (const aud of songAudios) {
        const isCurrent = state.activeAudio && state.activeAudio.id === aud.id;
        const audLabel = aud.filename ? aud.filename.replace(/^d{4}_[a-zA-Z0-9а-яА-ЯёЁ]+_/, '').replace(/.[^/.]+$/, '') : (aud.label || aud.type);
        const btn = Renderer.createElement('button', {
          className: 'audio-pill-btn ' + (isCurrent ? 'active' : ''),
          dataset: { action: 'play-song-variant', audioId: aud.id },
          style: 'display: flex; align-items: center; justify-content: space-between; gap: 0.5rem; width: 100%; text-align: left; padding: 0.5rem 0.75rem; margin-top: 0.35rem; border-radius: 0.5rem; background: var(--bg-secondary); border: 1px solid var(--border-color); cursor: pointer;',
          title: aud.filename || aud.label
        }, [
          Renderer.createElement('span', { style: 'display: flex; align-items: center; gap: 0.5rem; min-width: 0; flex: 1;' }, [
            Renderer.createElement('span', { style: 'color: var(--accent); font-weight: bold;' }, ['▶']),
            Renderer.createElement('span', { className: 'truncate text-sm', style: 'color: var(--text-main); font-weight: 500;' }, [audLabel])
          ]),
          Renderer.createElement('span', { className: Renderer.getTypeBadgeClass(aud.type), style: 'flex-shrink: 0;' }, [aud.type])
        ]);
        grid.appendChild(btn);
      }
      audioCard.appendChild(grid);
    } else {
      audioCard.appendChild(Renderer.createElement('div', { className: 'text-sm text-muted mt-2' }, [
        'Для этой песни пока нет привязанных записей. Добавьте файл формата ',
        Renderer.createElement('code', {}, ['0482_studio_Белый_снег.mp3']),
        ' в настройках.'
      ]));
    }
    container.appendChild(audioCard);
  }

  updateSongNotesArea() {
    const state = store.getState();
    const song = state.songs.find(s => s.id === state.currentSongId);
    if (!song) return;

    const noteInput = document.getElementById('input-profile-note');
    if (noteInput) {
      const effectiveProfile = (state.currentProfile === 'none') ? 'leader' : state.currentProfile;
      const profName = MUSICIAN_PROFILES.find(p => p.id === effectiveProfile)?.label;
      noteInput.placeholder = 'Заметка для роли ' + profName + ' (хранится в базе под тэгом [' + effectiveProfile + '])...';
      noteInput.value = TaggedNotesHelper.getNoteForProfile(song.notes || '', effectiveProfile);
    }
  }

  refreshLyricsDisplay() {
    const state = store.getState();
    const song = state.songs.find(s => s.id === state.currentSongId);
    if (!song) return;

    const lbl = document.getElementById('transpose-val-label');
    if (lbl) {
      const currentTransVal = (this.currentSongTranspose > 0 ? '+' : '') + this.currentSongTranspose;
      lbl.textContent = song.key ? ChordTransposer.transposeChord(song.key, this.currentSongTranspose, state.notation === 'H') : currentTransVal;
    }
    const box = document.getElementById('lyrics-box');
    if (box) Renderer.renderLyrics(box, song, this.currentSongTranspose);
  }

  renderPlaylistsView(container, headerActions) {
    container.innerHTML = '';
    const state = store.getState();

    // Кнопка импорта и добавления в шапке (только иконки)
    const importBtn = Renderer.createElement('button', {
      className: 'btn btn-outline btn-sm',
      style: 'min-width: 36px; padding: 0.35rem 0.5rem; font-size: 1.15rem;',
      dataset: { action: 'import-playlist-file' },
      title: 'Импортировать список из файла (.json, .txt, .fwp)'
    }, ['📥']);
    headerActions.appendChild(importBtn);

    const createBtn = Renderer.createElement('button', {
      className: 'btn btn-brick btn-sm',
      style: 'min-width: 36px; padding: 0.35rem 0.55rem; font-size: 1.15rem; font-weight: 800;',
      dataset: { action: 'create-new-playlist' },
      title: 'Создать новый список'
    }, ['+']);
    headerActions.appendChild(createBtn);

    const wrap = Renderer.createElement('div', {
      id: 'playlists-list-container',
      className: 'flex',
      style: 'flex-direction: column; gap: 0.85rem;'
    });

    // Системный список "Подбор" всегда активен на первом месте
    let activePlaylists = state.playlists.filter(p => p.is_archived !== '1' && p.id !== 'pl-temp');
    const plTemp = state.playlists.find(p => p.id === 'pl-temp') || {
      id: 'pl-temp',
      title: 'Подбор',
      date: new Date().toISOString().split('T')[0],
      purpose: 'Быстрый список для репетиции',
      is_public: '1',
      is_archived: '0'
    };
    activePlaylists.unshift(plTemp);
    const archivedPlaylists = state.playlists.filter(p => p.is_archived === '1');

    // Функция форматирования даты и времени: дд.мм.гг чч:мм
    const formatDateTime = (isoStr) => {
      if (!isoStr) return '—';
      try {
        const d = new Date(isoStr);
        const day = String(d.getDate()).padStart(2, '0');
        const mon = String(d.getMonth() + 1).padStart(2, '0');
        const yr = String(d.getFullYear()).slice(-2);
        const hr = String(d.getHours()).padStart(2, '0');
        const min = String(d.getMinutes()).padStart(2, '0');
        return day + '.' + mon + '.' + yr + ' ' + hr + ':' + min;
      } catch (e) {
        return isoStr;
      }
    };

    // 1. АКТИВНЫЕ СПИСКИ
    activePlaylists.forEach((pl) => {
      const isCur = pl.id === state.currentPlaylistId;
      const card = Renderer.createElement('div', {
        className: 'playlist-card-row',
        draggable: true,
        dataset: { dragPlaylistId: pl.id },
        style: 'border-color: ' + (isCur ? 'var(--accent)' : 'var(--border-color)') + '; background: var(--bg-card);'
      });

      const items = state.playlistItems
        .filter(it => it.playlist_id === pl.id)
        .sort((a, b) => parseInt(a.order, 10) - parseInt(b.order, 10));

      const topInfoRow = Renderer.createElement('div', {
        style: 'display: flex; flex-direction: column; width: 100%; gap: 0.35rem;'
      });

      const titleLine = Renderer.createElement('div', { style: 'display: flex; align-items: center; gap: 0.4rem; width: 100%;' }, [
        Renderer.createElement('span', { style: 'color: var(--text-muted); font-size: 1rem; font-weight: 700; cursor: grab;' }, ['↕']),
        Renderer.createElement('span', {
          style: 'font-weight: 800; font-size: 1.05rem; color: var(--text-main); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1;'
        }, [pl.title])
      ]);
      topInfoRow.appendChild(titleLine);

      const metaLine = Renderer.createElement('div', {
        className: 'text-sm text-muted flex items-center gap-2 flex-wrap',
        style: 'width: 100%; font-size: 0.8rem; justify-content: space-between;'
      }, [
        Renderer.createElement('span', {
          className: 'badge-editable-purpose',
          dataset: { action: 'edit-playlist-purpose', playlistId: pl.id },
          title: 'Нажмите, чтобы изменить комментарий',
          style: 'background: rgba(180, 83, 9, 0.12); color: var(--accent); padding: 2px 7px; border-radius: 4px; font-weight: 600; cursor: pointer;'
        }, ['💬 ' + (pl.purpose || 'Без комментария') + ' ✎']),
        Renderer.createElement('span', { style: 'color: var(--text-muted); font-variant-numeric: tabular-nums;' }, [formatDateTime(pl.updated_at || pl.date)])
      ]);
      topInfoRow.appendChild(metaLine);
      card.appendChild(topInfoRow);

      const countBadge = Renderer.createElement('span', {
        className: 'badge-num',
        style: 'font-size: 0.8rem; padding: 0.25rem 0.6rem; border-radius: 999px; background: var(--badge-bg); color: var(--chord-color); font-weight: 700; margin-right: auto;'
      }, [items.length + ' песен']);

      // Панель действий: flex items-center justify-between gap-1 text-sm flex-wrap (точно такой же размер и стиль как в песнях)
      const actionsLeft = Renderer.createElement('div', { className: 'flex gap-1 items-center flex-wrap' }, [
        countBadge,
        Renderer.createElement('button', {
          className: 'btn btn-outline btn-sm',
          style: 'padding: 0.35rem 0.6rem; font-size: 1.05rem; min-width: 38px; min-height: 38px;',
          dataset: { action: 'preview-playlist-modal', playlistId: pl.id },
          title: 'Просмотр списка'
        }, ['📋']),
        Renderer.createElement('button', {
          className: 'btn btn-outline btn-sm',
          style: 'padding: 0.35rem 0.6rem; font-size: 1.05rem; min-width: 38px; min-height: 38px;',
          dataset: { action: 'edit-playlist-in-songs', playlistId: pl.id },
          title: 'Редактировать список (В работу)'

        Renderer.createElement('button', {
          className: 'btn btn-outline btn-sm',
          style: 'padding: 0.35rem 0.6rem; font-size: 1.05rem; min-width: 38px; min-height: 38px;',

          title: 'Поделиться списком'

      ]);

      const actionsRight = Renderer.createElement('div', { className: 'flex gap-1 items-center flex-wrap' }, [
        Renderer.createElement('button', {
          className: 'btn btn-primary btn-sm',
          style: 'padding: 0.35rem 0.6rem; font-size: 1.05rem; min-width: 38px; min-height: 38px;',
          dataset: { action: 'play-playlist-in-player', playlistId: pl.id },
          title: 'Воспроизвести в плеере'
        }, ['▶']),
        Renderer.createElement('button', {
          className: 'btn btn-primary btn-sm',
          style: 'padding: 0.35rem 0.6rem; font-size: 1.05rem; min-width: 38px; min-height: 38px;',
          dataset: { action: 'open-concert-from-playlist', playlistId: pl.id },
          title: 'Концертный режим'

        ...(pl.id !== 'pl-temp' ? [
          Renderer.createElement('button', {
            className: 'btn btn-outline btn-sm text-muted',

            dataset: { action: 'archive-playlist', playlistId: pl.id },
            title: 'Переместить в архив'
          }, ['🗑'])
        ] : [])
      ]);

      const actionsGrid = Renderer.createElement('div', {
        className: 'playlist-actions-grid flex items-center justify-between gap-1 text-sm flex-wrap',
        style: 'margin-top: 0.35rem; padding-top: 0.25rem;'
      }, [actionsLeft, actionsRight]);
      card.appendChild(actionsGrid);

      wrap.appendChild(card);
    });

    // 2. РАЗДЕЛ АРХИВА В САМОМ НИЗУ
    if (archivedPlaylists.length > 0) {
      const archiveHeader = Renderer.createElement('div', {
        style: 'margin-top: 1.5rem; padding-top: 1rem; border-top: 2px dashed var(--border-color); display: flex; align-items: center; justify-content: space-between;'
      }, [
        Renderer.createElement('strong', { className: 'text-muted text-sm' }, ['📦 Архив списков (' + archivedPlaylists.length + ')']),
        Renderer.createElement('span', { className: 'text-xs text-muted' }, ['В архиве'])
      ]);
      wrap.appendChild(archiveHeader);

      archivedPlaylists.forEach((pl) => {
        const card = Renderer.createElement('div', {
          className: 'playlist-card-row',
          style: 'opacity: 0.75; background: var(--bg-card); border-left: 4px solid var(--text-muted);'
        });

        const topInfoRow = Renderer.createElement('div', {
          style: 'display: flex; align-items: flex-start; justify-content: space-between; gap: 0.5rem;'

        const titleGroup = Renderer.createElement('div', { style: 'flex: 1; min-width: 0;' }, [

        }, [

          Renderer.createElement('button', {
            className: 'btn btn-primary btn-sm',

            className: 'btn btn-outline btn-sm',

            title: 'Стереть навсегда'
          }, ['🗑'])
        ]);
        card.appendChild(archActions);

        wrap.appendChild(card);
      });
    }

    container.appendChild(wrap);
  }

  async handleImportFile(e) {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    try {
      const text = await file.text();
      const data = JSON.parse(text);
      if (data.taggedSongNotes) {
        const state = store.getState();
        undoManager.pushState('Импорт базы заметок', { songs: state.songs });

        const updatedSongs = [...state.songs];
        let count = 0;
        for (const [sid, noteStr] of Object.entries(data.taggedSongNotes)) {
          const s = updatedSongs.find(x => x.id === sid);
          if (s) {
            s.notes = noteStr;
            count++;
          }
        }
        await storage.saveBatch('songs', updatedSongs);
        this.searchEngine.updateIndex(updatedSongs);
        store.setState({ songs: updatedSongs });
        AppController.showToast('Успешно импортированы заметки для ' + count + ' песен!');
      } else {
        AppController.showToast('Некорректный формат файла заметок');
      }
    } catch (err) {
      AppController.showToast('Ошибка при чтении файла');
    }
  }
