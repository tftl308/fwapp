        }, [
          Renderer.createElement('div', { style: 'display: flex; align-items: center; gap: 0.5rem;' }, [
            Renderer.createElement('span', { className: 'badge-num text-xs' }, [String(idx + 1)]),
            Renderer.createElement('span', { style: 'font-weight: 700; color: var(--text-main);' }, [s ? s.title : ('Песня #' + it.song_id)])
          ]),
          Renderer.createElement('span', { style: 'color: var(--chord-color); font-weight: 700; font-size: 0.85rem;' }, [s ? (s.key || s.key_default || '—') : '—'])
        ]);
        listWrap.appendChild(itemRow);
      });
    }
    box.appendChild(listWrap);

    const btnRow = Renderer.createElement('div', { style: 'display: flex; gap: 0.5rem; justify-content: flex-end; border-top: 1px solid var(--border-color); padding-top: 0.5rem;' }, [
      Renderer.createElement('button', {
        className: 'btn btn-primary btn-sm',
        dataset: { action: 'open-concert-from-playlist', playlistId: playlistId }
      }, ['🎤 На сцену']),
      Renderer.createElement('button', {
        className: 'btn btn-outline btn-sm',
        dataset: { action: 'close-preview-modal' }
      }, ['Закрыть'])
    ]);
    box.appendChild(btnRow);

    overlay.appendChild(box);
    document.body.appendChild(overlay);
  }

  showPlaylistExportModal(playlistId) {
    const state = store.getState();
    const pl = state.playlists.find(p => p.id === playlistId);
    if (!pl) return;

    const items = state.playlistItems
      .filter(it => it.playlist_id === playlistId)
      .sort((a, b) => parseInt(a.order, 10) - parseInt(b.order, 10));

    const exportData = {
      playlist: {
        id: pl.id,
        title: pl.title,
        date: pl.date || new Date().toISOString().slice(0, 10),
        purpose: pl.purpose || '',
        updated_at: pl.updated_at || new Date().toISOString()
      },
      items: items.map(it => {
        const s = state.songs.find(x => x.id === it.song_id);
        return {
          order: it.order,
          id: it.song_id,
          title: s ? s.title : ('Песня #' + it.song_id),
          key: s ? (s.key || s.key_default || '') : '',
          capo: s ? (s.capo || '') : ''
        };
      }),
      exported_at: new Date().toISOString()
    };

    const jsonStr = JSON.stringify(exportData, null, 2);
    const textLines = [
      'СПИСОК: ' + pl.title + (pl.purpose ? ' (' + pl.purpose + ')' : ''),
      'Дата: ' + (pl.date || new Date().toISOString().slice(0, 10)),
      'Песен: ' + items.length,
      '---'
    ];
    exportData.items.forEach(it => {
      textLines.push(it.order + '. #' + it.id + ' ' + it.title + ' [' + (it.key || '—') + (it.capo ? ', capo ' + it.capo : '') + ']');
    });
    const textSummary = textLines.join('\n');

    const existing = document.getElementById('preview-modal-overlay');
    if (existing) existing.remove();

    const overlay = Renderer.createElement('div', {
      id: 'preview-modal-overlay',
      className: 'qr-modal-overlay',
      dataset: { action: 'close-preview-modal' }
    });

    const box = Renderer.createElement('div', {
      className: 'preview-modal-box',
      style: 'background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 1rem; padding: 1.25rem; max-width: 520px; width: 94%; max-height: 85vh; display: flex; flex-direction: column; gap: 0.75rem; box-shadow: 0 10px 30px rgba(0,0,0,0.25);'
    });
    box.addEventListener('click', (e) => {
      const actionEl = e.target.closest('[data-action]');
      if (actionEl && actionEl.dataset.action === 'close-preview-modal') return;
      e.stopPropagation();
    });

        const hdr = Renderer.createElement('div', {
      style: 'display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color); padding-bottom: 0.5rem;'
    }, [
      Renderer.createElement('h3', { style: 'margin: 0; font-size: 1.15rem; color: var(--accent);' }, ['Поделиться списком: ' + pl.title]),
      Renderer.createElement('button', { className: 'btn btn-outline btn-sm', dataset: { action: 'close-preview-modal' } }, ['✕'])
    ]);
    box.appendChild(hdr);

    const desc = Renderer.createElement('p', {
      style: 'font-size: 0.85rem; color: var(--text-muted); margin: 0.5rem 0;'
    }, ['Выберите формат для отправки музыкантам. Файлы .json и .txt беспрепятственно пересылаются в Telegram, WhatsApp и почте. Другой человек нажимает «📥 Импорт списка» и сразу получает этот сетлист!']);
    box.appendChild(desc);

    const btnsRow = Renderer.createElement('div', {
      style: 'display: flex; gap: 0.5rem; flex-wrap: wrap; margin-bottom: 0.5rem;'
    }, [
      Renderer.createElement('button', { className: 'btn btn-primary btn-sm', id: 'btn-dl-pl-json' }, ['💾 Скачать файл .json']),
      Renderer.createElement('button', { className: 'btn btn-outline btn-sm', id: 'btn-dl-pl-txt' }, ['📄 Скачать текст .txt']),
      Renderer.createElement('button', { className: 'btn btn-outline btn-sm', id: 'btn-copy-pl-txt' }, ['📋 Скопировать текст'])
    ]);
    box.appendChild(btnsRow);

    const lbl = Renderer.createElement('div', {
      style: 'font-size: 0.82rem; font-weight: 700; color: var(--text-muted); margin-top: 0.25rem;'
    }, ['Содержимое списка:']);
    box.appendChild(lbl);

    const txtArea = Renderer.createElement('textarea', {
      readOnly: true,
      className: 'input-textarea',
      style: 'width: 100%; height: 180px; font-family: monospace; font-size: 0.82rem; background: var(--bg-primary);'
    }, [textSummary]);
    box.appendChild(txtArea);

    const ftr = Renderer.createElement('div', {
      style: 'display: flex; justify-content: flex-end; gap: 0.5rem; margin-top: 0.5rem;'
    }, [
      Renderer.createElement('button', { className: 'btn btn-outline btn-sm', dataset: { action: 'close-preview-modal' } }, ['Закрыть'])
    ]);
    box.appendChild(ftr);
    overlay.appendChild(box);
    document.body.appendChild(overlay);

    document.getElementById('btn-dl-pl-json')?.addEventListener('click', () => {
      this.downloadFile(jsonStr, (pl.title || 'playlist').replace(/s+/g, '_') + '.json', 'application/json');
    });
    document.getElementById('btn-dl-pl-txt')?.addEventListener('click', () => {
      this.downloadFile(textSummary, (pl.title || 'playlist').replace(/s+/g, '_') + '.txt', 'text/plain');
    });
    document.getElementById('btn-copy-pl-txt')?.addEventListener('click', () => {
      navigator.clipboard.writeText(textSummary);
      AppController.showToast('Текст списка скопирован в буфер!');
    });
  }

  async handleImportPlaylistFile(file) {
    if (!file) return;
    try {
      const text = await file.text();
      const state = store.getState();
      let importedTitle = file.name.replace(/.(json|txt|fwp)$/i, '');
      let songIds = [];

      if (file.name.endsWith('.json') || text.trim().startsWith('{')) {
        const parsed = JSON.parse(text);
        if (parsed.playlist && parsed.playlist.title) importedTitle = parsed.playlist.title;
        if (parsed.items && Array.isArray(parsed.items)) {
          songIds = parsed.items.map(it => String(it.id || it.song_id).padStart(4, '0'));
        }
      } else {
        const lines = text.split(/\r?\n/);
        for (const line of lines) {
          const m = line.match(/#(d{4})/) || line.match(/^(d+)[.s]+#?(d{1,4})/);
          if (m) {
            const num = m[1] || m[2];
            songIds.push(String(num).padStart(4, '0'));
          } else {
            const numOnly = line.match(/^(d{1,4})[.s]+/);
            if (numOnly) {
              songIds.push(String(numOnly[1]).padStart(4, '0'));
            }
          }
        }
      }

      if (songIds.length === 0) {
        alert('В выбранном файле не удалось распознать песни списка.');
        return;
      }

      const newPlId = 'pl-' + Date.now();
      const newPl = {
        id: newPlId,
        title: importedTitle + ' (Импорт)',
        date: new Date().toISOString().slice(0, 10),
        purpose: 'Импортированный список',
        is_public: '1',
        is_archived: '0',
        updated_at: new Date().toISOString()
      };

      const newItems = songIds.map((sid, idx) => ({
        id: 'pli-' + newPlId + '-' + (idx + 1),
        playlist_id: newPlId,
        song_id: sid,
        order: String(idx + 1)
      }));

      const updatedPlaylists = [...state.playlists, newPl];
      const updatedItems = [...state.playlistItems, ...newItems];

      await storage.saveBatch('playlists', updatedPlaylists);
      await storage.saveBatch('playlistItems', updatedItems);

      store.setState({
        playlists: updatedPlaylists,
        playlistItems: updatedItems,
        currentPlaylistId: newPlId,
        currentTab: 'playlists'
      });

      alert('УСПЕШНО ИМПОРТИРОВАНО!\n\nСписок: «' + newPl.title + '»\nДобавлено песен: ' + newItems.length + '.\nСписок открыт в разделе Списки.');
    } catch (err) {
      alert('Ошибка чтения файла списка: ' + err.message);
    }
  }

  sharePlaylist(playlistId) {
    this.showPlaylistExportModal(playlistId);
  }
}

document.addEventListener('DOMContentLoaded', () => {
  window.appController = new AppController();
  window.appController.init();
});
</script>
